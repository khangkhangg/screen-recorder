[package]
name = "recorder-win"
version = "0.1.0"
edition = "2021"

[dependencies]
recorder-core = { path = "../recorder-core" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Direct2D", "Win32_System_Threading", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct2D_Common", "Win32_Devices_Display", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Foundation", "Foundation_Metadata", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Media_Audio", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Imaging", "Win32_Storage_FileSystem", "Win32_System_Time"] }

[features]
# Fake sources and writers for the session tests.
fakes = []

[dev-dependencies]
recorder-win = { path = ".", features = ["fakes"] }
