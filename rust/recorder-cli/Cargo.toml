[package]
name = "recorder-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "screenrec"
path = "src/main.rs"

[dependencies]
recorder-win = { path = "../recorder-win" }
recorder-core = { path = "../recorder-core" }
serde_json = "1"

[dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Console"] }
